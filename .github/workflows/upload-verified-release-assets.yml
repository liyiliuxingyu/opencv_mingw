name: Upload verified assets to an owner-created draft

on:
  workflow_dispatch:
    inputs:
      verified_run_id:
        description: 'Run containing the successful verification gates and verified artifact'
        required: true
        type: string
      run_attempt:
        description: 'Verified run attempt'
        required: true
        default: '1'
        type: string
      variant:
        description: 'Verified edition to attach without rebuilding'
        required: true
        default: mingw-release-python
        type: choice
        options: [mingw-release-python, mingw-debug, cuda-release-python]
      draft_release_tag:
        description: 'Exact tag of an owner-created draft targeting the original source commit'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: verified-release-assets-${{ inputs.draft_release_tag }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
      VERIFIED_RUN_ATTEMPT: ${{ inputs.run_attempt }}
      VARIANT: ${{ inputs.variant }}
      DRAFT_RELEASE_TAG: ${{ inputs.draft_release_tag }}
    steps:
      - name: Check out the attachment verification helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Verify original workflow, passed gates and artifact identity
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/upload-verified-release-assets.ps1 -VerifiedRunId $env:VERIFIED_RUN_ID `
            -RunAttempt $env:VERIFIED_RUN_ATTEMPT -Variant $env:VARIANT `
            -DraftReleaseTag $env:DRAFT_RELEASE_TAG -ResolveOnly | Out-Null
      - name: Download the original verified files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          path: ${{ runner.temp }}/verified-release-assets
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verified_run_id }}
          merge-multiple: true
      - name: Validate checksums and attach files to the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_RELEASE_ID: ${{ steps.source.outputs.draft_release_id }}
        run: |
          ./scripts/upload-verified-release-assets.ps1 -VerifiedRunId $env:VERIFIED_RUN_ID `
            -RunAttempt $env:VERIFIED_RUN_ATTEMPT -Variant $env:VARIANT `
            -DraftReleaseId $env:DRAFT_RELEASE_ID -ArtifactDir "$env:RUNNER_TEMP/verified-release-assets" `
            -ManifestPath "$env:RUNNER_TEMP/verified-release-upload.json"
      - name: Retain the small attachment audit record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release-upload-${{ steps.source.outputs.draft_release_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-release-upload.json
          if-no-files-found: warn
          retention-days: 14
