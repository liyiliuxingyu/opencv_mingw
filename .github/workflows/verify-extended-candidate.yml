name: Verify an extended OpenCV candidate

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Original extended build workflow run ID'
        required: true
        type: string
      source_run_attempt:
        description: 'Original run attempt containing the candidate artifact'
        required: true
        default: '1'
        type: string
      variant:
        description: 'Candidate edition to verify without rebuilding OpenCV'
        required: true
        default: mingw-release-python
        type: choice
        options:
          - mingw-release-python
          - mingw-debug
          - cuda-release-python
      publish:
        description: 'Publish verified original binaries (default branch only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: opencv-extended-recovery-${{ inputs.variant }}-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      VARIANT: ${{ inputs.variant }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
    steps:
      - name: Check out current verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            scripts
            examples

      - name: Check original workflow identity and publication branch
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          foreach ($value in @($env:SOURCE_RUN_ID, $env:SOURCE_RUN_ATTEMPT)) {
            if ($value -notmatch '^[1-9][0-9]*$') { throw 'Source run ID and attempt must be positive integers.' }
          }
          $json = & gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the original extended build run.' }
          $source = ($json -join "`n") | ConvertFrom-Json
          if ($source.repository.full_name -ne $env:GITHUB_REPOSITORY -or
              $source.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or
              $source.path -ne '.github/workflows/build-extended.yml' -or
              $source.event -notin @('push', 'workflow_dispatch') -or $source.status -ne 'completed' -or
              [string]$source.id -ne $env:SOURCE_RUN_ID -or [long]$source.run_attempt -lt [long]$env:SOURCE_RUN_ATTEMPT -or
              $source.head_sha -notmatch '^[0-9a-f]{40}$') {
            throw 'Choose a completed extended build from this repository.'
          }
          if ($env:GITHUB_REF -ne "refs/heads/$($source.head_branch)") {
            throw 'Run recovery on the same branch as the original build; the verification commit may be newer.'
          }
          if ($env:PUBLISH_REQUESTED -eq 'true' -and $env:GITHUB_REF -ne "refs/heads/$env:DEFAULT_BRANCH") {
            throw 'Publication is restricted to candidates and verification on the default branch.'
          }
          $source | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath "$env:RUNNER_TEMP/extended-source-run.json" -Encoding utf8NoBOM

      - name: Download the original unverified candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opencv-extended-candidate-${{ inputs.variant }}-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}

      - name: Verify checkpoint hashes and restore SDK paths
        id: restore
        run: |
          ./scripts/restore-extended-candidate.ps1 -CandidateDir "$env:GITHUB_WORKSPACE/dist" `
            -SourceRunFile "$env:RUNNER_TEMP/extended-source-run.json" `
            -SourceRunId $env:SOURCE_RUN_ID -SourceRunAttempt $env:SOURCE_RUN_ATTEMPT `
            -Variant $env:VARIANT -WorkRoot "$env:RUNNER_TEMP/extended recovery"

      - name: Install the exact original CPython release
        if: steps.restore.outputs.python_required == 'true'
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.restore.outputs.python_version }}
          architecture: x64
          check-latest: false

      - name: Rebase verification tools and restore exact CUDA dependencies when needed
        env:
          STATE_FILE: ${{ steps.restore.outputs.state_file }}
          PYTHON_EXE: ${{ steps.python.outputs.python-path }}
          EXPECTED_PYTHON_VERSION: ${{ steps.restore.outputs.python_version }}
          CUDA_LOCK_FILE: ${{ steps.restore.outputs.cuda_lock_file }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $state = Get-Content -LiteralPath $env:STATE_FILE -Raw | ConvertFrom-Json -AsHashtable
          $tools = [ordered]@{ variant=$env:VARIANT; workflow_commit=$env:GITHUB_SHA; github_run_id=$env:GITHUB_RUN_ID }
          if ($env:PYTHON_EXE) {
            $probe = & $env:PYTHON_EXE -I -c 'import json,platform,struct,sys,sysconfig; print(json.dumps(dict(version=platform.python_version(),implementation=platform.python_implementation(),bits=struct.calcsize("P")*8,platform=sys.platform,debug=bool(sysconfig.get_config_var("Py_DEBUG")),free_threaded=bool(sysconfig.get_config_var("Py_GIL_DISABLED")))))'
            if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the restored Python interpreter.' }
            $python = ($probe | Out-String) | ConvertFrom-Json
            if ($python.version -ne $env:EXPECTED_PYTHON_VERSION -or $python.implementation -ne 'CPython' -or
                $python.bits -ne 64 -or $python.platform -ne 'win32' -or $python.debug -or $python.free_threaded) {
              throw 'Recovery requires the exact original standard Windows x64 CPython interpreter.'
            }
            $state.python_executable = $env:PYTHON_EXE
            $tools['python'] = $python
          }
          if ($env:VARIANT -eq 'cuda-release-python') {
            $expected = Get-Content -LiteralPath $env:CUDA_LOCK_FILE -Raw | ConvertFrom-Json
            $cuda = & ./scripts/install-cuda-toolkit.ps1 -WorkRoot "$env:RUNNER_TEMP/extended recovery/cuda-toolkit" `
              -CudaVersion $expected.cuda_version -CudnnVersion $expected.cudnn_version -ExpectedLockFile $env:CUDA_LOCK_FILE
            $msvc = & ./scripts/enter-msvc.ps1
            $state.cuda_root = $cuda.cuda_root
            $state.cudnn_root = $cuda.cudnn_root
            $state.nvcc_executable = $cuda.nvcc_executable
            $state.cudnn_include_dir = $cuda.cudnn_include_dir
            $state.cudnn_library = $cuda.cudnn_library
            $state.cuda_runtime_bin_dirs = @($cuda.runtime_bin_dirs)
            $crt = @(Get-ChildItem -LiteralPath (Join-Path $msvc.redist_root 'x64') -Directory |
              Where-Object { $_.Name -match '^Microsoft\.VC[0-9]+\.(CRT|OpenMP)$' } | ForEach-Object FullName)
            if ($crt.Count -eq 0) { throw 'The fresh MSVC redistributable runtime directories are missing.' }
            $state.runtime_directories = $crt + @($cuda.runtime_bin_dirs)
            $state.toolchain_root = $msvc.installation_root
            $state.compiler_executable = $msvc.compiler
            $state.dumpbin_executable = $msvc.dumpbin
            $state.vcvars_path = $msvc.vcvars_path
            $state.cmake_executable = (Get-Command cmake.exe -ErrorAction Stop).Source
            $state.ninja_executable = (Get-Command ninja.exe -ErrorAction Stop).Source
            $tools['verification_msvc'] = $msvc
            $tools['cuda_dependencies_match_original_lock'] = $true
            $tools['cuda_version'] = $cuda.cuda_version
            $tools['cudnn_version'] = $cuda.cudnn_version
          } else {
            $tools['bundled_toolchain'] = $state.toolchain_root
          }
          $state | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath $env:STATE_FILE -Encoding utf8NoBOM
          $tools | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath "$env:RUNNER_TEMP/extended recovery/recovery-tools.json" -Encoding utf8NoBOM

      - name: Reverify staged SDK, relocated ZIP, installation and uninstall
        env:
          RESULT_FILE: ${{ steps.restore.outputs.result_file }}
          STATE_FILE: ${{ steps.restore.outputs.state_file }}
          PYTHON_EXE: ${{ steps.python.outputs.python-path }}
        run: |
          $parameters = @{ResultFile=$env:RESULT_FILE; WorkRoot="$env:RUNNER_TEMP/extended distribution verification"}
          if ($env:PYTHON_EXE) { $parameters.PythonExecutable = $env:PYTHON_EXE }
          if ($env:VARIANT -eq 'cuda-release-python') {
            $parameters.StateFile = $env:STATE_FILE
            ./scripts/verify-cuda-distribution.ps1 @parameters
          } else {
            ./scripts/verify-distribution.ps1 @parameters
          }

      - name: Reverify the original wheel in a clean Python environment
        if: steps.restore.outputs.python_required == 'true'
        env:
          PYTHON_EXE: ${{ steps.python.outputs.python-path }}
          WHEEL_PATH: ${{ steps.restore.outputs.wheel_path }}
          RESULT_FILE: ${{ steps.restore.outputs.result_file }}
        run: |
          $result = Get-Content -LiteralPath $env:RESULT_FILE -Raw | ConvertFrom-Json
          $parameters = @{PythonExecutable=$env:PYTHON_EXE; WheelPath=$env:WHEEL_PATH;
            WorkRoot="$env:RUNNER_TEMP/extended wheel verification"; ExpectedVersion=$result.opencv_version}
          if ($env:VARIANT -eq 'cuda-release-python') { $parameters.RequireCuda = $true }
          ./scripts/test-python-package.ps1 @parameters | Out-Null
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/extended wheel verification/python-test-result.json" `
            -Destination "$env:GITHUB_WORKSPACE/dist/python-wheel-verification.json"

      - name: Check publication gates and prepare public checksums
        env:
          RESULT_FILE: ${{ steps.restore.outputs.result_file }}
          SOURCE_COMMIT: ${{ steps.restore.outputs.source_commit }}
        run: |
          ./scripts/publish-extended.ps1 -ResultFile $env:RESULT_FILE -Variant $env:VARIANT `
            -SourceCommit $env:SOURCE_COMMIT -PrepareOnly

      - name: Upload verified original binaries and new verification records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opencv-extended-${{ inputs.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.whl
            dist/*-build-info.json
            dist/*-build-lock.json
            dist/verification.json
            dist/python-wheel-result.json
            dist/python-wheel-verification.json
            dist/candidate-origin.json
            dist/SHA256SUMS
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Publish with the original build commit as the release target
        if: inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_FILE: ${{ steps.restore.outputs.result_file }}
          SOURCE_COMMIT: ${{ steps.restore.outputs.source_commit }}
        run: |
          ./scripts/publish-extended.ps1 -ResultFile $env:RESULT_FILE -Variant $env:VARIANT -SourceCommit $env:SOURCE_COMMIT

      - name: Preserve recovery diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opencv-extended-recovery-logs-${{ inputs.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/candidate-origin.json
            dist/verification.json
            dist/python-wheel-verification.json
            ${{ runner.temp }}/extended recovery/recovery-tools.json
            ${{ runner.temp }}/extended recovery/cuda-toolkit/versions.cuda.lock.json
            ${{ runner.temp }}/extended distribution verification/**/*.log
            ${{ runner.temp }}/extended distribution verification/**/CMakeConfigureLog.yaml
            ${{ runner.temp }}/extended distribution verification/**/opencv-build-info.txt
            ${{ runner.temp }}/extended distribution verification/**/test-result.json
            ${{ runner.temp }}/extended distribution verification/**/python-test-result.json
            ${{ runner.temp }}/extended distribution verification/**/gpu-verification.json
            ${{ runner.temp }}/extended wheel verification/**/*.log
            ${{ runner.temp }}/extended wheel verification/python-test-result.json
          retention-days: 14
          if-no-files-found: warn
